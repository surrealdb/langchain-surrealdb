[project]
name = "example_graph"
version = "0.1.0"
description = ""
authors = [{ name = "Martin Schaer", email = "martin.schaer@surrealdb.com" }]
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-ollama>=1.0.0,<2.0.0",
    "langchain-surrealdb",
    "surrealdb>=1.0.4,<2.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-community>=0.4.0,<1.0.0",
    "click>=8.2.1,<9.0.0",
]

[project.scripts]
run = "example_graph.main:cli"

[tool.uv.sources]
langchain-surrealdb = { path = "../../", editable = true }

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"
