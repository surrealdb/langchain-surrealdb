[project]
name = "langchain-surrealdb"
version = "0.1.4"
description = "An integration package connecting SurrealDB and LangChain"
readme = "README.md"
requires-python = ">=3.10,<4.0"
license = "MIT"
dependencies = [
    "langchain-core~=1.1.0",
    "surrealdb @ git+https://github.com/surrealdb/surrealdb.py.git",
    "numpy~=1.26.0; python_version < \"3.13\"",
    "numpy~=2.3.5; python_version >= \"3.13\"",
]

[project.urls]
homepage = "https://surrealdb.com/docs/integrations/frameworks/langchain"
documentation = "https://surrealdb.com/docs/integrations/frameworks/langchain"
source = "https://github.com/surrealdb/langchain-surrealdb"

[project.optional-dependencies]
experimental = [
    "langchain-classic~=1.0.0",
    "langchain-community~=0.4.1"
]

[tool.uv]
default-groups = ["dev", "test", "codespell", "lint", "typing", "experimental", "examples"]

[tool.uv.workspace]
members = ["examples/*"]

[dependency-groups]
dev = ["notebook>=7.4.3,<8.0.0"]
test = [
    "pytest~=8.4.2",
    "pytest-asyncio~=1.3.0",
    "pytest-watcher~=0.4.3",
    "langchain-tests~=1.0.2",
]
codespell = ["codespell~=2.4.1"]
lint = ["ruff~=0.14.6"]
typing = ["basedpyright~=1.34.0"]
experimental = [
    "langchain-classic~=1.0.0",
    "langchain-community~=0.4.1"
]
examples = [
    "click~=8.3.1",
    "langchain-ollama~=1.0.0"
]

[tool.ruff.lint]
select = ["E", "F", "I", "T201"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config --durations=5"
markers = [
    "compile: mark placeholder test used to compile integration tests without running them",
]
asyncio_mode = "auto"
